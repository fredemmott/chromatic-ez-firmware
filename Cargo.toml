[package]
name = "chromatic-firmware-selector"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["blocking"] }
sha2 = "0.10"
hex = "0.4"
url = "2.5"
nusb = "0.2.7"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
indicatif = "0.18.6"
clap = { version = "4.6.7", features = ["derive"] }

[build-dependencies]
cmake = "0.1"